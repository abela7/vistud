# ViStud in a sealed box: a database, the web side, a background worker and a scheduler. Nothing here is reachable
# from the internet except through the web server on the host, which forwards to 127.0.0.1:8081.
#
# Run it through the helper `vistud-compose` (made by deploy/docker/setup.sh):
#   vistud-compose ps          vistud-compose logs -f app          vistud-compose exec app php artisan about
#
# Memory limits are caps, not reservations: together they cannot starve the other sites on the server.
name: vistud

x-vistud: &vistud
  image: vistud-app:local
  restart: unless-stopped
  env_file: /opt/vistud/vistud.env
  networks: [internal]
  depends_on:
    db:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - ${VISTUD_DATA:-/opt/vistud/data}/storage:/var/www/html/storage
    - ${VISTUD_DATA:-/opt/vistud/data}/ledger:/var/lib/vistud-erasure-ledger
    - ${VISTUD_DATA:-/opt/vistud/data}/exports:/independent-exports

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    networks: [internal]
    env_file: /opt/vistud/db.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=120
      # Change logs kept 7 days (docs/development/operations.md).
      - --binlog-expire-logs-seconds=604800
    volumes:
      - ${VISTUD_DATA:-/opt/vistud/data}/mysql:/var/lib/mysql
      - ./mysql-init.sh:/docker-entrypoint-initdb.d/10-vistud.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    mem_limit: 1g
    cpus: 2

  app:
    <<: *vistud
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["app"]
    ports:
      - "127.0.0.1:8081:8080"
    tmpfs:
      - /run/vistud-tmp:size=256m,mode=0700,uid=33,gid=33
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: localhost' http://127.0.0.1:8080/up > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 1g
    cpus: 2

  worker:
    <<: *vistud
    command: ["worker"]
    tmpfs:
      - /run/vistud-tmp:size=512m,mode=0700,uid=33,gid=33
    stop_grace_period: 120s
    mem_limit: 1536m
    cpus: 2

  scheduler:
    <<: *vistud
    command: ["scheduler"]
    tmpfs:
      - /run/vistud-tmp:size=64m,mode=0700,uid=33,gid=33
    mem_limit: 256m
    cpus: 0.5

networks:
  internal:
    driver: bridge
