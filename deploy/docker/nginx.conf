# nginx for the box. It runs as the unprivileged web user, so every writable path is under /run/vistud-tmp (memory)
# or /tmp, and it listens on 8080 (not 80). Uploads are buffered in memory-backed storage, never on disk.
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /run/vistud-tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /run/vistud-tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    include /tmp/vistud-site.conf;
}
