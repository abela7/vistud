; PHP-FPM pool for the box. It listens only inside the container (nginx talks to it on 127.0.0.1).
[global]
; Not run as a daemon; its messages go to the container's console.
daemonize = no

[www]
listen = 127.0.0.1:9000
; The secrets (master key, ledger key) arrive as process environment variables: keep them visible to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; An AI-app call may take up to 230 seconds (docs/development/deploy.md).
request_terminate_timeout = 250s
