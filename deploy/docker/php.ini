; ViStud settings for PHP in the box (web and command line).
memory_limit = 512M
upload_max_filesize = 30M
post_max_size = 40M
max_execution_time = 240
expose_php = Off
display_errors = Off
log_errors = On
; No error_log file: PHP errors go to the container's console (PHP-FPM catches its workers' output).

; Uploads and every temporary file go to memory-backed storage (docs/development/operations.md).
upload_tmp_dir = /run/vistud-tmp
sys_temp_dir = /run/vistud-tmp

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 10
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

date.timezone = UTC
